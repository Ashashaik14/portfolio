<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#14141e"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#bgGrad4)"/>
  <rect width="800" height="480" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top bar -->
  <g transform="translate(30, 25)">
    <circle cx="8" cy="8" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="26" cy="8" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="44" cy="8" r="5" fill="#10B981" opacity="0.8"/>
    <text x="75" y="12" fill="#A1A1AA" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="1">AVIATION_TELEMETRY // FLIGHT DELAYS & ON-TIME PERFORMANCE</text>
    <rect x="620" y="-2" width="110" height="22" rx="11" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" stroke-width="0.8"/>
    <text x="635" y="13" fill="#67E8F9" font-family="sans-serif" font-size="10" font-weight="600">500K+ FLIGHTS</text>
  </g>

  <!-- Metric summary -->
  <g transform="translate(30, 65)">
    <rect width="230" height="75" rx="10" fill="#111116" stroke="rgba(255,255,255,0.06)"/>
    <text x="18" y="24" fill="#71717A" font-family="sans-serif" font-size="11">TOTAL FLIGHTS EVALUATED</text>
    <text x="18" y="55" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">541,200</text>
    <text x="160" y="52" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="600">99.8% Record</text>

    <g transform="translate(255, 0)">
      <rect width="230" height="75" rx="10" fill="#111116" stroke="rgba(255,255,255,0.06)"/>
      <text x="18" y="24" fill="#71717A" font-family="sans-serif" font-size="11">MEDIAN DEPARTURE DELAY</text>
      <text x="18" y="55" fill="#A855F7" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">8.4 mins</text>
      <text x="150" y="52" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="600">-14.2% YoY</text>
    </g>

    <g transform="translate(510, 0)">
      <rect width="230" height="75" rx="10" fill="#111116" stroke="rgba(255,255,255,0.06)"/>
      <text x="18" y="24" fill="#71717A" font-family="sans-serif" font-size="11">CARRIER ON-TIME RATE</text>
      <text x="18" y="55" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">84.2%</text>
      <text x="165" y="52" fill="#C4B5FD" font-family="sans-serif" font-size="11" font-weight="600">STABLE</text>
    </g>
  </g>

  <!-- Flight Delay Heatmap Matrix -->
  <g transform="translate(30, 165)">
    <rect width="470" height="275" rx="12" fill="#111116" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Airport Congestion & Weather Delay Heatmap</text>
    <text x="20" y="48" fill="#71717A" font-family="sans-serif" font-size="11">Hour-of-day vs Day-of-week probability matrix</text>

    <!-- Heatmap grid -->
    <g transform="translate(25, 75)">
      <!-- Weekdays labels -->
      <text x="0" y="20" fill="#71717A" font-family="sans-serif" font-size="11">MON</text>
      <text x="0" y="55" fill="#71717A" font-family="sans-serif" font-size="11">WED</text>
      <text x="0" y="90" fill="#71717A" font-family="sans-serif" font-size="11">FRI</text>
      <text x="0" y="125" fill="#71717A" font-family="sans-serif" font-size="11">SUN</text>

      <!-- Heat blocks -->
      <g transform="translate(45, 5)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="38" height="25" rx="4" fill="#1E1E28"/>
        <rect x="44" y="0" width="38" height="25" rx="4" fill="#3B0764"/>
        <rect x="88" y="0" width="38" height="25" rx="4" fill="#581C87"/>
        <rect x="132" y="0" width="38" height="25" rx="4" fill="#7C3AED"/>
        <rect x="176" y="0" width="38" height="25" rx="4" fill="#9333EA"/>
        <rect x="220" y="0" width="38" height="25" rx="4" fill="#6B21A8"/>
        <rect x="264" y="0" width="38" height="25" rx="4" fill="#3B0764"/>
        <rect x="308" y="0" width="38" height="25" rx="4" fill="#1E1E28"/>

        <!-- Row 2 -->
        <rect x="0" y="35" width="38" height="25" rx="4" fill="#1E1E28"/>
        <rect x="44" y="35" width="38" height="25" rx="4" fill="#2E1065"/>
        <rect x="88" y="35" width="38" height="25" rx="4" fill="#7C3AED"/>
        <rect x="132" y="35" width="38" height="25" rx="4" fill="#A855F7"/>
        <rect x="176" y="35" width="38" height="25" rx="4" fill="#C084FC"/>
        <rect x="220" y="35" width="38" height="25" rx="4" fill="#9333EA"/>
        <rect x="264" y="35" width="38" height="25" rx="4" fill="#581C87"/>
        <rect x="308" y="35" width="38" height="25" rx="4" fill="#2E1065"/>

        <!-- Row 3 (Friday peak) -->
        <rect x="0" y="70" width="38" height="25" rx="4" fill="#2E1065"/>
        <rect x="44" y="70" width="38" height="25" rx="4" fill="#6B21A8"/>
        <rect x="88" y="70" width="38" height="25" rx="4" fill="#A855F7"/>
        <rect x="132" y="70" width="38" height="25" rx="4" fill="#E879F9"/>
        <rect x="176" y="70" width="38" height="25" rx="4" fill="#F43F5E"/>
        <rect x="220" y="70" width="38" height="25" rx="4" fill="#C084FC"/>
        <rect x="264" y="70" width="38" height="25" rx="4" fill="#7C3AED"/>
        <rect x="308" y="70" width="38" height="25" rx="4" fill="#3B0764"/>

        <!-- Row 4 -->
        <rect x="0" y="105" width="38" height="25" rx="4" fill="#1E1E28"/>
        <rect x="44" y="105" width="38" height="25" rx="4" fill="#3B0764"/>
        <rect x="88" y="105" width="38" height="25" rx="4" fill="#7C3AED"/>
        <rect x="132" y="105" width="38" height="25" rx="4" fill="#9333EA"/>
        <rect x="176" y="105" width="38" height="25" rx="4" fill="#A855F7"/>
        <rect x="220" y="105" width="38" height="25" rx="4" fill="#7C3AED"/>
        <rect x="264" y="105" width="38" height="25" rx="4" fill="#581C87"/>
        <rect x="308" y="105" width="38" height="25" rx="4" fill="#1E1E28"/>
      </g>
    </g>
  </g>

  <!-- Route delays -->
  <g transform="translate(520, 165)">
    <rect width="250" height="275" rx="12" fill="#111116" stroke="rgba(255,255,255,0.06)"/>
    <text x="18" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Top Congested Hubs</text>
    <text x="18" y="48" fill="#71717A" font-family="sans-serif" font-size="11">Average turnaround bottleneck</text>

    <g transform="translate(18, 75)">
      <text x="0" y="12" fill="#D4D4D8" font-family="sans-serif" font-size="12">ORD → LGA</text>
      <text x="175" y="12" fill="#F87171" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">+34m</text>
      <rect y="20" width="210" height="6" rx="3" fill="#1E1E28"/>
      <rect y="20" width="180" height="6" rx="3" fill="#EF4444"/>
    </g>

    <g transform="translate(18, 125)">
      <text x="0" y="12" fill="#D4D4D8" font-family="sans-serif" font-size="12">ATL → SFO</text>
      <text x="175" y="12" fill="#FBBF24" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">+22m</text>
      <rect y="20" width="210" height="6" rx="3" fill="#1E1E28"/>
      <rect y="20" width="130" height="6" rx="3" fill="#F59E0B"/>
    </g>

    <g transform="translate(18, 175)">
      <text x="0" y="12" fill="#D4D4D8" font-family="sans-serif" font-size="12">DFW → LAX</text>
      <text x="175" y="12" fill="#34D399" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">+11m</text>
      <rect y="20" width="210" height="6" rx="3" fill="#1E1E28"/>
      <rect y="20" width="80" height="6" rx="3" fill="#10B981"/>
    </g>

    <g transform="translate(18, 225)">
      <text x="0" y="12" fill="#D4D4D8" font-family="sans-serif" font-size="12">DEN → SEA</text>
      <text x="175" y="12" fill="#34D399" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">+7m</text>
      <rect y="20" width="210" height="6" rx="3" fill="#1E1E28"/>
      <rect y="20" width="45" height="6" rx="3" fill="#10B981"/>
    </g>
  </g>
</svg>
